services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: spelmoment-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "SpelMoment2026!Secure"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
