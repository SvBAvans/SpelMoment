name: build

env:
  artifactName: buildArtifact

on:
  pull_request: 
    branches:
      - master
    
  push:
    branches-ignore: 
      - master
    
  workflow_call: 
  workflow_dispatch: 
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      
      - name: Restore dependencies
        run:  |
          dotnet restore
          dotnet tool install --global Microsoft.Web.LibraryManager.Cli
          libman restore
        
      - name: Build
        run: dotnet build --no-restore
        
      - name: Test
        run: dotnet test --no-build --verbosity normal
        
      - name: Publish
        run: dotnet publish ./SpelMoment --output ./dist/ui --configuration Release  
        
      - name: Bundle EF Project
        run: |
          dotnet tool install --global dotnet-ef
          dotnet tool restore
          dotnet ef migrations bundle --output ./dist/migrations/migrations.exe --startup-project ./SpelMoment --project ./SpelMoment.Infrastructure --context SpelMomentDbContext --self-contained -r linux-x64
          dotnet ef migrations bundle --output ./dist/migrations/migrations-auth.exe --startup-project ./SpelMoment --project ./SpelMoment.Infrastructure --context AuthDbContext --self-contained -r linux-x64
        
      - name: Upload artifact API
        uses: actions/upload-artifact@v4
        with:
          name: spelmoment
          path: ./dist/ui
  
      - name: Upload artifact Migrations
        uses: actions/upload-artifact@v4
        with:
          name: spelmoment-migrations
          path: ./dist/migrations   
